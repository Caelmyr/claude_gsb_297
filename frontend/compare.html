<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案对比 — 排程求解系统</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">排程求解系统</div>
    <div class="brand-sub">运筹优化与排程求解</div>
    <nav id="nav"></nav>
    <div class="section-label">问题实例</div>
    <select id="problem-picker"></select>
  </aside>
  <main class="main">
    <div class="page-head">
      <h1>方案对比</h1>
      <span class="sub">不同求解方案在目标与指标上的并排对比</span>
    </div>

    <div class="card">
      <h2>选择要对比的方案</h2>
      <div id="solution-checks" class="flex" style="flex-wrap:wrap"></div>
      <div class="btn-row">
        <button class="btn primary" onclick="compare()">对比所选</button>
        <button class="btn" onclick="toggleAll(true)">全选</button>
        <button class="btn" onclick="toggleAll(false)">清空</button>
      </div>
    </div>

    <div class="card" id="result-card" style="display:none">
      <h2>对比结果</h2>
      <p class="small muted" id="chart-hint"></p>
      <div class="chart-wrap" id="bar-chart"></div>
      <div class="chart-wrap" id="scatter-chart" style="display:none"></div>
      <table class="mt"><thead><tr id="cmp-head">
        <th>求解器</th><th>来源</th><th>状态</th><th class="num">标量目标值</th><th class="num">与最优差距</th>
        <th class="num">完工时间</th><th class="num">拖期</th><th class="num">成本</th><th class="num">加班</th>
        <th class="num">耗时(s)</th><th class="num">下界</th><th></th>
      </tr></thead><tbody id="rows"></tbody></table>
    </div>

    <div class="card">
      <h2>全部方案一览</h2>
      <table><thead><tr><th>ID</th><th>求解器</th><th>来源</th><th>优化口径</th><th class="num">目标值</th><th class="num">完工/加班</th><th>创建时间</th></tr></thead>
        <tbody id="all-rows"></tbody></table>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/charts.js"></script>
<script>
let problem = null;
let solutions = [];

initSidebar('compare.html');

async function load() {
  const id = currentProblemId();
  if (!id) return;
  problem = await api('/problems/' + id);
  const r = await api(`/problems/${problem.id}/solutions`);
  solutions = r.solutions;
  renderChecks();
  renderAll();
}

function renderChecks() {
  const el = document.getElementById('solution-checks');
  el.innerHTML = solutions.map((s) => {
    const tag = s.pareto_run_id
      ? `<span class="badge info">前沿#${s.pareto_rank ?? ''}</span> ` : '';
    return `
    <label style="margin:0 16px 8px 0;font-size:13px;color:var(--ink)">
      <input type="checkbox" value="${s.id}" style="width:auto;margin-right:5px">
      ${tag}${escapeHtml(solverLabel(s.solver))}
      <span class="muted">(${s.pareto_run_id ? objectiveVectorText(s) : fmt(s.objective_value)})</span>
    </label>`;
  }).join('') || '<span class="muted">暂无求解结果。</span>';
}

function selected() {
  return [...document.querySelectorAll('#solution-checks input:checked')].map(i => i.value);
}

function toggleAll(on) {
  document.querySelectorAll('#solution-checks input').forEach(i => i.checked = on);
}

/* Group Pareto members by run so each front is drawn as one series and
   ordinary single-objective solutions appear on the same axes. */
function scatterSeries(rows) {
  const groups = new Map();
  const singles = [];
  for (const s of rows) {
    const v = s.objectives || {};
    if (s.pareto_run_id && v.makespan != null && v.overtime_cost != null) {
      if (!groups.has(s.pareto_run_id)) groups.set(s.pareto_run_id, []);
      groups.get(s.pareto_run_id).push(s);
    } else if (v.makespan != null && v.overtime_cost != null) {
      singles.push(s);
    }
  }
  const palette = ['#2563eb', '#7e22ce', '#0d9488', '#b45309'];
  const series = [];
  let gi = 0;
  for (const [runId, members] of groups) {
    series.push({
      name: `前沿 ${runId.slice(-6)}`,
      color: palette[gi++ % palette.length],
      points: members.map(s => ({
        x: s.objectives.makespan, y: s.objectives.overtime_cost,
        label: '#' + (s.pareto_rank ?? ''), payload: s.id,
      })),
    });
  }
  if (singles.length) {
    series.push({
      name: '单目标方案', color: '#e15759',
      points: singles.map(s => ({
        x: s.objectives.makespan, y: s.objectives.overtime_cost,
        label: solverLabel(s.solver), payload: s.id, r: 6,
      })),
    });
  }
  return series;
}

async function compare() {
  const ids = selected();
  if (!ids.length) return toast('请至少选择一个方案', 'error');
  const { solutions: rows } = await api(`/problems/${problem.id}/compare`, {
    method: 'POST', body: JSON.stringify({ solution_ids: ids }),
  });
  document.getElementById('result-card').style.display = 'block';

  // Scalar bar chart only for solutions that actually have a scalar objective;
  // Pareto points have none, so they are shown exclusively on the 2-D front.
  const scalarRows = rows.filter(s => s.objective_value != null);
  if (scalarRows.length) {
    document.getElementById('bar-chart').style.display = 'block';
    barChart(document.getElementById('bar-chart'), {
      labels: scalarRows.map(s => solverLabel(s.solver) + (s.is_best ? ' ★' : '')),
      values: scalarRows.map(s => s.objective_value ?? 0),
      color: '#59a14f',
    });
  } else {
    document.getElementById('bar-chart').style.display = 'none';
  }

  const series = scatterSeries(rows);
  const has2d = series.some(g => g.points.length);
  document.getElementById('scatter-chart').style.display = has2d ? 'block' : 'none';
  document.getElementById('chart-hint').textContent = has2d
    ? '二维目标视图：同一坐标内叠加 Pareto 前沿方案与普通单目标方案，可直观看出谁也压不倒谁。'
    : '';
  if (has2d) {
    scatterChart(document.getElementById('scatter-chart'), {
      series, xLabel: objectiveShort('makespan'), yLabel: objectiveShort('overtime_cost'),
      onPoint: (sid) => { window.location.href =
        `gantt.html?id=${encodeURIComponent(problem.id)}&solution=${encodeURIComponent(sid)}`; },
    });
  }

  const best = (s, name) => s.best_by_objective && s.best_by_objective[name];
  const cell = (s, name) => {
    const v = solutionObjective(s, name);
    if (v == null) return '<td class="num">—</td>';
    return `<td class="num" ${best(s, name) ? 'style="background:#f0fdf4;font-weight:700"' : ''}>${fmt(v)}${best(s, name) ? ' ★' : ''}</td>`;
  };
  document.getElementById('rows').innerHTML = rows.map(s => `
    <tr ${s.is_best ? 'style="background:#fefce8"' : ''}>
      <td>${escapeHtml(solverLabel(s.solver))} ${s.is_best ? '<span class="badge ok">标量最优</span>' : ''}</td>
      <td>${s.pareto_run_id
        ? `<span class="badge info">多目标前沿</span>`
        : '<span class="muted">单目标</span>'}</td>
      <td>${statusBadge(s.status)}</td>
      <td class="num"><b>${fmt(s.objective_value)}</b></td>
      <td class="num">${s.delta_vs_best == null ? '—' : (s.delta_vs_best > 0 ? '+' : '') + fmt(s.delta_vs_best)}</td>
      ${cell(s, 'makespan')}
      ${cell(s, 'tardiness')}
      ${cell(s, 'cost')}
      ${cell(s, 'overtime_cost')}
      <td class="num">${fmt(s.solve_time)}</td>
      <td class="num">${fmt(s.lower_bound)}</td>
      <td><a href="gantt.html?id=${encodeURIComponent(problem.id)}&solution=${encodeURIComponent(s.id)}">甘特图</a></td>
    </tr>`).join('');
}

function renderAll() {
  document.getElementById('all-rows').innerHTML = solutions.map(s => `
    <tr><td class="mono">${escapeHtml(s.id)}</td><td>${escapeHtml(solverLabel(s.solver))}</td>
      <td>${s.pareto_run_id ? '<span class="badge info">前沿</span>' : '单目标'}</td>
      <td class="small">${escapeHtml((s.optimized_objectives || ['makespan']).map(objectiveLabel).join(' + '))}</td>
      <td class="num">${fmt(s.objective_value)}</td>
      <td class="num">${fmt(solutionObjective(s, 'makespan'))} / ${fmt(solutionObjective(s, 'overtime_cost'))}</td>
      <td class="small muted">${escapeHtml(s.created_at)}</td></tr>`).join('')
    || '<tr><td colspan="7" class="empty">暂无求解结果。</td></tr>';
}

load().catch(e => toast(e.message, 'error'));
</script>
</body>
</html>
